# GoReleaser v2. Release: git tag vX.Y.Z && git push --tags (CI runs this).
# Local dry run: goreleaser release --snapshot --clean
version: 2
project_name: atalaya

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/atalaya
    env:
      - CGO_ENABLED=0 # gopsutil uses purego on macOS: no cgo needed
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE*]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: otuletta
    name: atalaya

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:", "^ci:"]

# brew install otuletta/tap/atalaya
homebrew_casks:
  - name: atalaya
    repository:
      owner: otuletta
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/otuletta/atalaya
    description: Torre de control para tus proyectos en la terminal
    binaries: [atalaya]
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/atalaya"]
          end
