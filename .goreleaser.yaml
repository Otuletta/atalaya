# GoReleaser v2. Release: git tag vX.Y.Z && git push --tags (CI runs this).
# Local dry run: goreleaser release --snapshot --clean
version: 2
project_name: atalaya

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/atalaya
    env:
      - CGO_ENABLED=0 # gopsutil uses purego on macOS: no cgo needed
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README*, LICENSE*]

checksum:
  name_template: checksums.txt

# Signs and notarizes the macOS binaries (from Linux, with quill) only when
# the secrets exist; without them the release goes out unsigned and the
# cask removes the quarantine flag instead. The secrets:
#   MACOS_SIGN_P12          the Developer ID Application .p12, base64
#   MACOS_SIGN_PASSWORD     its password
#   MACOS_NOTARY_ISSUER_ID  App Store Connect API: issuer ID
#   MACOS_NOTARY_KEY_ID     App Store Connect API: key ID
#   MACOS_NOTARY_KEY        the .p8 key, base64
notarize:
  macos:
    - enabled: '{{ ne (envOrDefault "MACOS_SIGN_P12" "") "" }}'
      sign:
        certificate: '{{ envOrDefault "MACOS_SIGN_P12" "" }}'
        password: '{{ envOrDefault "MACOS_SIGN_PASSWORD" "" }}'
      notarize:
        issuer_id: '{{ envOrDefault "MACOS_NOTARY_ISSUER_ID" "" }}'
        key_id: '{{ envOrDefault "MACOS_NOTARY_KEY_ID" "" }}'
        key: '{{ envOrDefault "MACOS_NOTARY_KEY" "" }}'
        wait: true
        timeout: 20m

release:
  github:
    owner: otuletta
    name: atalaya

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:", "^ci:"]

# brew install otuletta/tap/atalaya
homebrew_casks:
  - name: atalaya
    repository:
      owner: otuletta
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/otuletta/atalaya
    description: Torre de control para tus proyectos en la terminal
    binaries: [atalaya]
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/atalaya"]
          end
